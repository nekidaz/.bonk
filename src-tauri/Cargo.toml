[package]
name = "bonk"
version = "0.1.9"
description = "Desktop API client for HTTP and gRPC."
authors = ["Bonk contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bonk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bonk-core = { path = "../crates/bonk-core" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "http2", "system-proxy", "gzip", "brotli"] }
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
trash = "5"

# Reading the native traffic-light buttons (commands::app::traffic_lights_right); already in the tree via tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }

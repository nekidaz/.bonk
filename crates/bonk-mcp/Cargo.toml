[package]
name = "bonk-mcp"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Model Context Protocol server for bonk workspaces"

[[bin]]
name = "bonk-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bonk-core = { path = "../bonk-core" }
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "system-proxy"] }
rmcp = { version = "3.1.2", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }
url = "2"

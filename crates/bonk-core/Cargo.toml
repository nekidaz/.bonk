[package]
name = "bonk-core"
version = "0.1.9"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same version reqwest pulls in for its `cookies` feature: a jar we can list, edit and save.
cookie_store = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "http2", "system-proxy", "gzip", "brotli", "cookies"] }
tonic = { version = "0.14.6", features = ["tls-native-roots"] }
tonic-reflection = "0.14.6"
prost = "0.14.1"
prost-types = "0.14.1"
prost-reflect = { version = "0.16.4", features = ["serde"] }
protox = "0.9"
fastrand = "2"
rquickjs = "0.12"
base64 = "0.22"
bytes = "1"
http = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "process", "io-util", "net"] }
tokio-stream = "0.1"
toml_edit = "0.25.12"
# Already in the tree via tonic; used directly for the gRPC TLS probe / insecure connector.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-native-certs = "0.8"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
p12-keystore = "0.3.2"

name: Release

# Build macOS, Linux and Windows release binaries (manual runs on main warm the cache).
# Version tags also package them and upload a draft GitHub Release.
#
# This repo (nekidaz/.bonk) builds and publishes its own releases; brew, choco,
# Pages and the in-app updater all read them from here.
#
# The bundles are UNSIGNED by Apple/Microsoft (Gatekeeper/SmartScreen will warn
# on first open), but they ARE signed with the Tauri updater key so the in-app
# auto-updater can verify and install them. tauri-action also publishes a
# `latest.json` update manifest, merged across all platforms.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if generated without one)
on:
  # Only tags build a release; main pushes are covered by ci.yml.
  push:
    tags:
      - 'v*'
  # Warm the cache manually, including before the first release after this change.
  # Dispatch never publishes, even when run against a tag.
  workflow_dispatch:

permissions:
  # Creating the release and uploading its assets needs write.
  contents: write

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  # Superseded main builds can stop; a release must finish its uploads.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            mcp-build-args: --target aarch64-apple-darwin
            mcp-path: target/aarch64-apple-darwin/release/bonk-mcp
            mcp-asset: bonk-mcp-aarch64-apple-darwin
            mcp-sidecar: src-tauri/binaries/bonk-mcp-aarch64-apple-darwin
            cli-path: target/aarch64-apple-darwin/release/bonk-cli
            cli-asset: bonk-aarch64-apple-darwin.tar.gz
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            mcp-build-args: ''
            mcp-path: target/release/bonk-mcp
            mcp-asset: bonk-mcp-x86_64-unknown-linux-gnu
            mcp-sidecar: src-tauri/binaries/bonk-mcp-x86_64-unknown-linux-gnu
            cli-path: target/release/bonk-cli
            cli-asset: bonk-x86_64-unknown-linux-gnu.tar.gz
          - platform: windows-latest
            args: --bundles nsis
            rust-targets: ''
            mcp-build-args: ''
            mcp-path: target/release/bonk-mcp.exe
            mcp-asset: bonk-mcp-x86_64-pc-windows-msvc.exe
            mcp-sidecar: src-tauri/binaries/bonk-mcp-x86_64-pc-windows-msvc.exe
            cli-path: target/release/bonk-cli.exe
            cli-asset: bonk-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Tags can restore main's cache, but cannot share caches with other tags.
      # Warm both MCP and desktop dependency graphs in release mode on main.
      # Keep this separate from CI's debug cache. Bump v1 if build flags change.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # Include the virtual workspace's release profile as well as the
          # member manifests/lockfile that rust-cache hashes automatically.
          shared-key: desktop-release-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      # The CLI shares the MCP server's dependency graph (bonk-core), so one build.
      - name: Build MCP server and CLI
        run: cargo build --locked --release --timings -p bonk-mcp -p bonk-cli ${{ matrix.mcp-build-args }}

      - name: Stage MCP sidecar for desktop bundle
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp "${{ matrix.mcp-path }}" "${{ matrix.mcp-sidecar }}"

      # Use the same target, release profile and Tauri CLI as the tag build.
      # No installer, updater signature or distribution token is needed here.
      - name: Warm desktop release build
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: npx tauri build ${{ matrix.args }} --no-bundle -- --locked --timings

      # The release body doubles as latest.json `notes`, which the in-app update
      # popover lists as "what's new" — so use this version's CHANGELOG section.
      - name: Release notes from CHANGELOG
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<__BONK_NOTES__'
            awk -v h="## [${GITHUB_REF_NAME#v}]" '/^## \[/ { p = index($0, h) == 1; next } p' CHANGELOG.md
            echo 'See [CHANGELOG.md](https://github.com/nekidaz/.bonk/blob/main/CHANGELOG.md) for details.'
            echo '__BONK_NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy/AppImage needs FUSE, which CI runners lack — extract instead of mount.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # Call the CLI directly: `npm run tauri` first runs prepare:mcp, which
          # rebuilt bonk-mcp in DEBUG (2–6 min) and overwrote the release sidecar
          # staged above, so the bundles shipped a debug MCP server.
          tauriScript: npx tauri
          releaseCommitish: main
          args: ${{ matrix.args }} -- --locked --timings
          tagName: ${{ github.ref_name }}
          releaseName: 'bonk ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Upload MCP server to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mcp-dist
          cp "${{ matrix.mcp-path }}" "mcp-dist/${{ matrix.mcp-asset }}"
          gh release upload "${{ github.ref_name }}" \
            "mcp-dist/${{ matrix.mcp-asset }}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      # The CLI is `bonk-cli` in the workspace (src-tauri's app binary is `bonk`) but ships
      # as `bonk`: an archive per platform holding `bonk` / `bonk.exe`.
      - name: Upload CLI to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p cli-dist
          if [[ "${{ matrix.cli-asset }}" == *.zip ]]; then
            cp "${{ matrix.cli-path }}" cli-dist/bonk.exe
            (cd cli-dist && 7z a -tzip "${{ matrix.cli-asset }}" bonk.exe)
          else
            cp "${{ matrix.cli-path }}" cli-dist/bonk
            chmod +x cli-dist/bonk
            tar -czf "cli-dist/${{ matrix.cli-asset }}" -C cli-dist bonk
          fi
          gh release upload "${{ github.ref_name }}" \
            "cli-dist/${{ matrix.cli-asset }}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.platform }}
          path: |
            target/cargo-timings/*.html
            target/*/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

name: Release

# Build signed macOS + Linux + Windows bundles and publish them to a GitHub
# Release when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# This is the PRIVATE source repo (nekidaz/bonk-src). The release is cross-
# published into the PUBLIC repo nekidaz/.bonk (via tauri-action's owner/repo +
# a PAT) so that brew/choco/Pages and end-user downloads keep pointing at a
# public repo while the source stays private.
#
# The bundles are UNSIGNED by Apple/Microsoft (Gatekeeper/SmartScreen will warn
# on first open), but they ARE signed with the Tauri updater key so the in-app
# auto-updater can verify and install them. tauri-action also publishes a
# `latest.json` update manifest, merged across all platforms.
#
# Required repo secrets (set on nekidaz/bonk-src):
#   DIST_TOKEN                          PAT with `contents:write` on nekidaz/.bonk
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if generated without one)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            mcp-build-args: --target aarch64-apple-darwin
            mcp-path: target/aarch64-apple-darwin/release/bonk-mcp
            mcp-asset: bonk-mcp-aarch64-apple-darwin
            mcp-sidecar: src-tauri/binaries/bonk-mcp-aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            mcp-build-args: ''
            mcp-path: target/release/bonk-mcp
            mcp-asset: bonk-mcp-x86_64-unknown-linux-gnu
            mcp-sidecar: src-tauri/binaries/bonk-mcp-x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --bundles nsis
            rust-targets: ''
            mcp-build-args: ''
            mcp-path: target/release/bonk-mcp.exe
            mcp-asset: bonk-mcp-x86_64-pc-windows-msvc.exe
            mcp-sidecar: src-tauri/binaries/bonk-mcp-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Restore-only: a cache saved by a tag run is scoped to that tag, so the
      # next tag could never read it — saving just cost minutes (4+ on Windows).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MCP server
        run: cargo build --release -p bonk-mcp ${{ matrix.mcp-build-args }}

      - name: Stage MCP sidecar for desktop bundle
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp "${{ matrix.mcp-path }}" "${{ matrix.mcp-sidecar }}"

      # The release body doubles as latest.json `notes`, which the in-app update
      # popover lists as "what's new" — so use this version's CHANGELOG section.
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<__BONK_NOTES__'
            awk -v h="## [${GITHUB_REF_NAME#v}]" '/^## \[/ { p = index($0, h) == 1; next } p' CHANGELOG.md
            echo 'See [CHANGELOG.md](https://github.com/nekidaz/.bonk/blob/main/CHANGELOG.md) for details.'
            echo '__BONK_NOTES__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          # DIST_TOKEN is a PAT with contents:write on nekidaz/.bonk; tauri-action
          # uses it to create the release in that (different) public repo.
          GITHUB_TOKEN: ${{ secrets.DIST_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy/AppImage needs FUSE, which CI runners lack — extract instead of mount.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # Call the CLI directly: `npm run tauri` first runs prepare:mcp, which
          # rebuilt bonk-mcp in DEBUG (2–6 min) and overwrote the release sidecar
          # staged above, so the bundles shipped a debug MCP server.
          tauriScript: npx tauri
          # Cross-publish the release into the public distribution repo.
          owner: nekidaz
          repo: .bonk
          releaseCommitish: main
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'bonk ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Upload MCP server to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          mkdir -p mcp-dist
          cp "${{ matrix.mcp-path }}" "mcp-dist/${{ matrix.mcp-asset }}"
          gh release upload "${{ github.ref_name }}" \
            "mcp-dist/${{ matrix.mcp-asset }}" \
            --clobber \
            --repo nekidaz/.bonk

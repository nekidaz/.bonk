name: Sync CHANGELOG

# The public distribution repo (nekidaz/.bonk) hosts the landing page + release
# downloads, but its CHANGELOG.md is a SEPARATE tree from this source repo. The
# release workflow (release.yml) only publishes Release objects into .bonk via
# tauri-action — it never commits any file there, so .bonk/CHANGELOG.md drifts
# behind. Every release's notes link to that file ("See CHANGELOG.md for
# details"), so a stale copy makes the link point at outdated notes.
#
# This workflow copies CHANGELOG.md from this repo into nekidaz/.bonk on every
# version tag, keeping the two in sync. It can also be dispatched manually
# (workflow_dispatch) to backfill after the changelog was updated without a tag.
#
# Reuses the DIST_TOKEN secret from release.yml: a PAT with contents:write on
# nekidaz/.bonk.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync CHANGELOG.md into nekidaz/.bonk
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${DIST_TOKEN}@github.com/nekidaz/.bonk.git" public
          cp CHANGELOG.md public/CHANGELOG.md
          cd public
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date — nothing to sync."
            exit 0
          fi
          git config user.name "bonk-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: sync CHANGELOG (${GITHUB_REF_NAME})"
          git push origin HEAD:main

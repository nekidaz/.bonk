name: CI

# Pushes to main run Linux only: private-repo minutes are billed, and macOS
# costs 10x, Windows 2x. Tags and manual runs (`gh workflow run CI --ref <branch>`)
# run all three.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name == 'push' && '["ubuntu-22.04"]' || '["macos-latest", "ubuntu-22.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TZ: UTC
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri 2's WebKit/GTK dependencies (same as the Linux release build).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: Svelte check
        run: npm run check

      - name: Unit tests
        run: npx vitest run --exclude '.claude/**'

      - name: Frontend build
        run: npm run build

      # The Tauri build script requires the MCP sidecar binary to exist under
      # src-tauri/binaries/, so stage it before any cargo build of the app crate.
      - name: Stage MCP sidecar
        run: node scripts/prepare-mcp-sidecar.mjs

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

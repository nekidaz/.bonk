name: Homebrew

# When a GitHub Release is published (i.e. you publish the draft created by the
# Release workflow), regenerate the Homebrew Cask (the app) and Formula (the `bonk`
# CLI) in the tap repo so `brew install --cask nekidaz/tap/bonk` and
# `brew install nekidaz/tap/bonk` pick up the new version.
#
# Required:
#   - a tap repo `nekidaz/homebrew-tap`
#   - repo secret HOMEBREW_TAP_TOKEN: a PAT with `contents:write` on that tap repo
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump-cask:
    runs-on: macos-latest
    steps:
      - name: Compute version, URL and sha256
        id: info
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          DMG="bonk_${VERSION}_aarch64.dmg"
          URL="https://github.com/nekidaz/.bonk/releases/download/${TAG}/${DMG}"
          curl -fL -o "$DMG" "$URL"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The CLI archives (bonk-<target>.tar.gz, one `bonk` binary each). A release
      # made before the CLI shipped has none: then only the cask is updated.
      - name: CLI archives and sha256
        id: cli
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            file="bonk-${target}.tar.gz"
            if ! curl -fL -o "$file" "https://github.com/nekidaz/.bonk/releases/download/${TAG}/${file}"; then
              echo "no ${file} in ${TAG}: skipping the CLI formula"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "sha_${target//-/_}=$(shasum -a 256 "$file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: nekidaz/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write cask
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA: ${{ steps.info.outputs.sha }}
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/bonk.rb <<EOF
          cask "bonk" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/nekidaz/.bonk/releases/download/v#{version}/bonk_#{version}_aarch64.dmg"
            name "bonk"
            desc "Local-first desktop API client for HTTP and gRPC"
            homepage "https://github.com/nekidaz/.bonk"

            app "bonk.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/bonk.app"]
            end

            zap trash: [
              "~/Library/Application Support/io.github.nekidaz.bonk",
              "~/Library/Caches/io.github.nekidaz.bonk",
              "~/Library/WebKit/io.github.nekidaz.bonk",
            ]
          end
          EOF

      - name: Write CLI formula
        if: steps.cli.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA_MAC: ${{ steps.cli.outputs.sha_aarch64_apple_darwin }}
          SHA_LINUX: ${{ steps.cli.outputs.sha_x86_64_unknown_linux_gnu }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/bonk.rb <<EOF
          class Bonk < Formula
            desc "Run Bonk API collections from the terminal and CI"
            homepage "https://github.com/nekidaz/.bonk"
            version "${VERSION}"
            license "MIT"

            on_macos do
              depends_on arch: :arm64
              url "https://github.com/nekidaz/.bonk/releases/download/v#{version}/bonk-aarch64-apple-darwin.tar.gz"
              sha256 "${SHA_MAC}"
            end

            on_linux do
              depends_on arch: :x86_64
              url "https://github.com/nekidaz/.bonk/releases/download/v#{version}/bonk-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "bonk"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/bonk --version")
            end
          end
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "bonk ${VERSION}" || { echo "no changes"; exit 0; }
          git push
